name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      # pip 25.1+ is required for `--group`; setup-python does not guarantee it.
      - run: python -m pip install --upgrade pip
      - run: pip install --group dev
      - run: ruff check .
      - run: ruff format --check .
      # Strict, on core/ only: pyproject.toml's [tool.mypy].
      - run: mypy

  # The floor (3.13, Mageia 10) and the runtime (3.14, GNOME 51): ruff's
  # py313 target blocks 3.14-only syntax, not a 3.14-only stdlib call.
  test-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      # msgfmt, for tests/test_translations.py: no skipif, it must run here.
      - run: sudo apt-get update && sudo apt-get install --yes gettext
      - run: python -m pip install --upgrade pip
      - run: pip install --group dev
      # Modules, branch coverage and the 100% floor: pyproject.toml.
      - run: pytest --cov

  # The ruleset on main requires a check named exactly "test"; a matrix
  # reports "test-python (3.13)" and "test-python (3.14)" instead. This
  # job keeps that name and passes only when every leg passed.
  test:
    needs: test-python
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-python.result }}" = success

  meson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'
      - run: >
          sudo apt-get update && sudo apt-get install --yes
          ninja-build libglib2.0-dev libglib2.0-dev-bin gettext
          desktop-file-utils appstream
      # apt ships meson 1.3 on the runner, below the 1.9 project floor.
      - run: pip install "meson>=1.9,<2"
      - run: meson setup build
      - run: meson compile -C build
      - run: >
          meson test -C build --print-errorlogs
          desktop-file-validate appstreamcli-validate glib-compile-schemas-validate

  flatpak:
    runs-on: ubuntu-latest
    container:
      # gnome-51, pinned by digest, per manifest index (§4 rule 8: Dependabot
      # does not track this reference, see STATE.md for the manual bump).
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ROADMAP §5.1: flatpak-builder-lint clean, useful even off Flathub.
      # Runs before the build so a manifest problem fails fast.
      - name: Lint the Flatpak manifest
        run: >
          flatpak-builder-lint manifest
          build-aux/flatpak/io.github.vertours.Rature.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: rature.flatpak
          manifest-path: build-aux/flatpak/io.github.vertours.Rature.yml
          cache-key: flatpak-builder-${{ github.sha }}
      # The action builds into repo/. Lint that too, minus the two
      # Flathub-submission-only rules (build-aux/flatpak/repo_lint.py).
      - name: Lint the built Flatpak repo
        run: python3 build-aux/flatpak/repo_lint.py repo

  # Real widgets under gtk4-broadwayd, inside the GNOME SDK the Flatpak
  # ships on (build-aux/ui-tests.sh, tests/ui/).
  ui:
    runs-on: ubuntu-latest
    container:
      # Same image as the flatpak job, pinned by digest (STATE.md).
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:78d969b18225ae107ca29497bf09c4a3f791e5f1838a9a912a529d0024fb6210
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the GNOME SDK
        run: |
          flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --noninteractive --or-update flathub org.gnome.Sdk//51
      # The container has no session bus; flatpak run needs one.
      - name: Run the UI tests
        run: >
          dbus-run-session --
          flatpak run --share=network --filesystem="$PWD" --cwd="$PWD"
          --command=bash org.gnome.Sdk//51 build-aux/ui-tests.sh
