name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      # pip 25.1+ is required for `--group`; setup-python does not guarantee it.
      - run: python -m pip install --upgrade pip
      - run: pip install --group dev
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      # msgfmt, for tests/test_translations.py: no skipif, it must run here.
      - run: sudo apt-get update && sudo apt-get install --yes gettext
      - run: python -m pip install --upgrade pip
      - run: pip install --group dev
      - run: pytest --cov=rature.core --cov-branch --cov-fail-under=100

  meson:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - run: >
          sudo apt-get update && sudo apt-get install --yes
          ninja-build libglib2.0-dev libglib2.0-dev-bin gettext
          desktop-file-utils appstream
      # apt ships meson 1.3 on the runner, below the 1.9 project floor.
      - run: pip install "meson>=1.9,<2"
      - run: meson setup build
      - run: meson compile -C build
      - run: >
          meson test -C build --print-errorlogs
          desktop-file-validate appstreamcli-validate glib-compile-schemas-validate

  flatpak:
    runs-on: ubuntu-latest
    container:
      # gnome-50, pinned by digest, per manifest index (§4 rule 8: Dependabot
      # does not track this reference, see STATE.md for the manual bump).
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # ROADMAP §5.1: flatpak-builder-lint clean, useful even off Flathub.
      # Runs before the build so a manifest problem fails fast.
      - name: Lint the Flatpak manifest
        run: >
          flatpak-builder-lint manifest
          build-aux/flatpak/io.github.vertours.Rature.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: rature.flatpak
          manifest-path: build-aux/flatpak/io.github.vertours.Rature.yml
          cache-key: flatpak-builder-${{ github.sha }}
      # The action builds into repo/. Lint that too, minus the two
      # Flathub-submission-only rules (build-aux/flatpak/repo_lint.py).
      - name: Lint the built Flatpak repo
        run: python3 build-aux/flatpak/repo_lint.py repo
