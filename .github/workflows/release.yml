name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GPG_FPR: C2CBB256D91B01B920B0BE3898280657575FC9DA
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release
    container:
      # gnome-50, pinned by digest, per manifest index (§4 rule 8: Dependabot
      # does not track this reference, see STATE.md for the manual bump).
      image: ghcr.io/flathub-infra/flatpak-github-actions@sha256:1de59efef01a946d9f28f1ec3458bf6f61dcee3507d7fecdd473f8134da4ec77
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # The repo descriptor, signing key, landing page and its screenshots
      # are distribution metadata, not versioned with the app. Take them
      # from the branch the workflow runs on, so re-publishing a tag cut
      # before this workflow existed still finds them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: _dist
          sparse-checkout: |
            io.github.vertours.Rature.flatpakrepo
            build-aux/flatpak/repo-signing-key.gpg
            build-aux/flatpak/index.html
            data/screenshots
            data/icons/hicolor/scalable/apps/io.github.vertours.Rature.svg
          sparse-checkout-cone-mode: false

      - name: Import the repo signing key
        run: printf '%s' "$KEY" | gpg --batch --import
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: rature.flatpak
          manifest-path: build-aux/flatpak/io.github.vertours.Rature.yml
          gpg-sign: ${{ env.GPG_FPR }}
          cache-key: flatpak-release-${{ github.sha }}

      - name: Generate static deltas and re-sign the summary
        run: >
          flatpak build-update-repo --generate-static-deltas
          --gpg-sign=${{ env.GPG_FPR }} repo

      - name: Assemble the Pages site
        run: |
          mkdir -p site
          mv repo site/repo
          cp _dist/io.github.vertours.Rature.flatpakrepo site/
          cp _dist/build-aux/flatpak/repo-signing-key.gpg site/
          cp _dist/build-aux/flatpak/index.html site/index.html
          cp -r _dist/data/screenshots site/screenshots
          cp _dist/data/icons/hicolor/scalable/apps/io.github.vertours.Rature.svg site/icon.svg

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle
          path: rature.flatpak
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bundle

      - name: Attach the bundle to the release
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --verify-tag \
                 --title "$RELEASE_TAG" --notes "See CHANGELOG.md."
          gh release upload "$RELEASE_TAG" rature.flatpak --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
