id: io.github.vertours.Rature
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: rature

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc

modules:
  - name: rature
    buildsystem: meson
    sources:
      - type: dir
        path: ../..
        skip:
          - .flatpak-builder
          - .git
          - .venv
          - build
          - build-flatpak
