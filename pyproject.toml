# Rature is built and installed by Meson, not by a Python build backend.
# This file carries project metadata, the development dependency group, and
# the configuration of the development tools. It is deliberately free of a
# [build-system] table so nothing invites `pip install .`.

[project]
name = "rature"
version = "2.0.0"
description = "Your day, one line at a time"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
authors = [{ name = "VertOurs", email = "vertours.dev@gmail.com" }]

# PEP 735. Install with `pip install --group dev` (pip 25.1+).
# Exact versions: CI and every contributor run the same linter and test
# runner. Dependabot proposes the bumps (.github/dependabot.yml).
[dependency-groups]
dev = [
    "ruff==0.17.3",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "FBT", # flake8-boolean-trap
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit
]

[tool.ruff.lint.per-file-ignores]
# pytest asserts by design; the tests parse the repository's own XML and
# run msgfmt with fixed arguments, so neither input is untrusted.
"tests/*" = ["S101", "S314", "S603", "S607"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
# The coverage gate (CI and CONTRIBUTING.md run `pytest --cov`): every
# module that imports no gi, so the whole of core/ plus the gi-free helpers
# beside it. ui/ modules that import GTK are left to the wiring tests
# (ADR 0002).
[tool.coverage.run]
source = [
    "rature.core",
    "rature.i18n",
    "rature.logging_setup",
    "rature.ui.reorder",
    "rature.ui.weekdays",
]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
